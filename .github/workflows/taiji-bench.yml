# =============================================================================
# LVPA（太极多维量化系统）— 性能基准测试管线
# =============================================================================
# 用途：检测性能回归，确保 Layer 1 实时计算层毫秒级约束不被破坏
#
# 触发条件：
#   - PR 标签包含 'benchmark'
#   - 对 main 的 push 中修改了 taiji-engine/taiji-bar/taiji-pattern 等核心 crate
#   - 每周四 UTC 06:00
#   - 手动触发
#
# 门禁：benchmark 结果不阻塞 CI，仅生成报告
# =============================================================================

name: LVPA Benchmark

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  push:
    branches: [main]
    paths:
      - 'src/crates/taiji/taiji-engine/**'
      - 'src/crates/taiji/taiji-bar/**'
      - 'src/crates/taiji/taiji-pattern/**'
      - 'src/crates/taiji/taiji-orderflow/**'
      - 'src/crates/taiji/taiji-realtime/**'
  schedule:
    - cron: "0 6 * * 4"   # 每周四 UTC 06:00
  workflow_dispatch:
    inputs:
      compare_with_main:
        description: "Compare results against main branch"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Criterion 基准测试 ─────────────────────────────────────────
  criterion-bench:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'benchmark' ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          # 基准测试需要 git history 用于 baseline 比较
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libssl-dev linux-tools-common \
            linux-tools-$(uname -r) || true

      - name: Generate lockfile
        run: cargo generate-lockfile

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "lvpa-bench-v1"
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install cargo-criterion
        run: cargo install cargo-criterion --locked

      - name: Run taiji-engine benchmarks
        continue-on-error: true
        run: |
          for crate in taiji-engine taiji-bar taiji-pattern; do
            echo "=== Benchmarking $crate ==="
            cargo criterion -p "$crate" 2>&1 || \
            cargo bench -p "$crate" 2>&1 || \
            echo "NO_BENCH: $crate has no benchmarks"
          done

      - name: Run taiji-orderflow benchmarks (if exists)
        continue-on-error: true
        run: |
          cargo criterion -p taiji-orderflow 2>&1 || \
          cargo bench -p taiji-orderflow 2>&1 || \
          echo "NO_BENCH: taiji-orderflow has no benchmarks"

  # ── 2. Criterion 基准比较（PR 场景） ─────────────────────────────
  bench-compare:
    name: Benchmark Compare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: criterion-bench
    if: >
      github.event_name == 'pull_request' &&
      (github.event.label.name == 'benchmark' ||
       contains(github.event.pull_request.labels.*.name, 'benchmark'))
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate lockfile
        run: cargo generate-lockfile

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "lvpa-bench-compare-v1"
          cache-bin: false

      - name: Install cargo-criterion
        run: cargo install cargo-criterion --locked

      - name: Install critcmp
        run: cargo install critcmp --locked

      - name: Benchmark current branch
        continue-on-error: true
        run: |
          cargo bench -p taiji-engine -- --save-baseline current 2>&1 || \
          echo "NO_BENCH: no baseline to save"

      - name: Benchmark main branch
        continue-on-error: true
        shell: bash
        run: |
          # 仅在存在未提交变更时 stash，避免空 stash 污染
          git diff --quiet || git stash push -m "benchmark-temp"
          git checkout main
          cargo bench -p taiji-engine -- --save-baseline main 2>&1 || true
          git checkout -
          # 恢复 stash（空 stash pop 安全退出）
          git stash pop 2>/dev/null || true

      - name: Compare benchmarks
        continue-on-error: true
        id: compare
        run: |
          critcmp main current 2>&1 | tee bench-report.txt || \
          echo "NO_COMPARE: unable to compare"

      - name: Check for regressions
        continue-on-error: true
        shell: bash
        run: |
          if [ -f bench-report.txt ]; then
            regressions=$(grep -cE '\+[0-9]+\.[0-9]+%' bench-report.txt || echo "0")
            echo "Found $regressions potential regressions"
            if [ "$regressions" -gt 0 ]; then
              echo "::warning::${regressions} benchmark regression(s) detected"
              grep -E '\+[0-9]+\.[0-9]+%' bench-report.txt | head -20
            fi
          fi

      - name: Comment benchmark results on PR
        uses: actions/github-script@v7
        continue-on-error: true
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            let report = '### Benchmark Report\n\nNo benchmark data available.';
            try {
              const data = fs.readFileSync('bench-report.txt', 'utf-8');
              report = '### Benchmark Report\n\n```\n' + data.slice(0, 60000) + '\n```';
            } catch (e) {
              // file may not exist
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
