[package]
name = "taiji-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LVPA 量化交易终端 — CLI & TUI（天机令/天机盘）"

[[bin]]
name = "taiji"
path = "src/main.rs"

[dependencies]
# taiji 引擎
taiji-engine = { path = "../taiji-engine" }
taiji-bar = { path = "../taiji-bar" }
taiji-example = { path = "../taiji-example" }
taiji-backtest = { path = "../taiji-backtest" }

# CLI 框架
clap = { workspace = true, features = ["derive", "env"] }

# TUI
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }

# 异步
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# 传输层
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }

# 输出格式化
csv = { workspace = true }
tabled = "0.16"

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 时间
chrono = { workspace = true }

# 系统工具
dirs = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# MCP/ACP
rmcp = { workspace = true, features = ["server", "macros"] }
agent-client-protocol = { workspace = true }

[lints]
workspace = true
